# Render Blueprint — backend API only (frontend on Vercel)
# Dashboard: New > Blueprint > connect repo, or create Web Service manually with these settings.

services:
  - type: web
    name: talentflow-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_PATH
        value: /tmp/ats_database.db
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.9"
