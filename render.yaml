version: 1

services:
  - type: web
    name: ats-backend
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    env:
      - key: ENV
        value: production

staticSites:
  - name: ats-frontend
    path: frontend
    buildCommand: npm ci && npm run build
    publishPath: dist
    env:
      - key: API_BASE
        value: /

# Notes:
# - Replace plans and add region as needed in Render UI or CLI.
# - For secrets (DATABASE_URL, SECRET_KEY) create Render secrets and reference them in the Render dashboard or change `env` entries to `fromSecret` mappings.
