version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_PATH=/data/ats_database.db
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    volumes:
      - ats_data:/data
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ats_data:
