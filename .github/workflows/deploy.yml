name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/resumescreening-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/resumescreening-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to remote server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            mkdir -p ${{ secrets.REMOTE_COMPOSE_DIR }}
            cd ${{ secrets.REMOTE_COMPOSE_DIR }}
            # Pull latest images
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/resumescreening-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/resumescreening-frontend:latest
            # Create/overwrite prod compose
            cat > docker-compose.prod.yml <<'EOF'
            version: "3.9"
            services:
              backend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/resumescreening-backend:latest
                environment:
                  - DATABASE_PATH=/data/ats_database.db
                  - DEBUG=false
                  - SECRET_KEY=${{ secrets.SECRET_KEY }}
                volumes:
                  - ats_data:/data
                restart: unless-stopped
                expose:
                  - "8000"

              frontend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/resumescreening-frontend:latest
                ports:
                  - "80:80"
                depends_on:
                  - backend
                restart: unless-stopped

            volumes:
              ats_data:
            EOF

            docker compose -f docker-compose.prod.yml pull || true
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml ps
